services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: antsworld
      POSTGRES_USER: antsworld
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antsworld -d antsworld"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data # Persist data with a volume

  pgadmin:
    build: ./utilities/pgadmin
    attach: false
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@ants.world
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  db_migrator:
    build:
      context: .
      dockerfile: ./utilities/migrator/Dockerfile
    environment:
      - DATABASE_URL=postgresql://antsworld:password@db:5432/antsworld
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: no
    depends_on:
      - db

volumes:
  db_data:
  pgadmin_data:
