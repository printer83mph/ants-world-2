[project]
name = "migrator"
version = "0.1.0"
description = "Tool for migrating between database revisions"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "db",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[tool.uv.sources]
db = { path = "../../shared/database", editable = true }
