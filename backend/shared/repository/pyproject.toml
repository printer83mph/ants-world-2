[project]
name = "repo"
version = "0.1.0"
description = "Shared repository module for abstracted data access"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "db",
    "numpy>=2.4.4",
    "protobuf>=7.34.1",
    "pydantic>=2.12.5",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo"]
include = ["repo/py.typed"]

[tool.uv.sources]
db = { path = "../database", editable = true }

[tool.basedpyright]
typeCheckingMode = "recommended"
extraPaths = [
    "../database",
]
exclude = [
    "protopy",
]

[tool.ruff]
exclude = [
    "protopy",
]
