[project]
name = "repo"
version = "0.1.0"
description = "Shared repository module for abstracted data access"
requires-python = ">=3.12"
dependencies = [
    "db",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo"]

[tool.uv.sources]
db = { path = "../database", editable = true }
