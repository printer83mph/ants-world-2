[project]
name = "db"
version = "0.1.0"
description = "Shared database package"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]
include = ["db/py.typed"]

[tool.basedpyright]
typeCheckingMode = "recommended"
