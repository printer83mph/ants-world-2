[project]
name = "baseconfig"
version = "0.1.0"
description = "Shared base config classes"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseconfig"]
include = ["baseconfig/py.typed"]
